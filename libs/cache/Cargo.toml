[package]
name = "cache"
version = "0.7.2"
edition = "2024"
description = "A general purpose cache with possibly multiple remote servers for storing and retrieving data."
license = "BSD-3-Clause"

[dependencies]
serde = { workspace = true, features = ["derive", "rc"] }
once_cell = "1"
tonic = "0.14"
futures-core = "0.3"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = "0.7"
bytes = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
rusqlite = { version = "0.43", features = ["bundled"] }
fs4 = { version = "1.0", features = ["tokio"] }
thiserror = "2"
toml = { workspace = true }
clap = { version = "4", features = ["derive"] }
tokio-rusqlite = "0.10"
sha2 = "0.11"
hex = "0.4"
flexbuffers = "25"
path-absolutize = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
backoff = "0.4"
regex = "1"
lazy_static = "1"

[build-dependencies]
tonic-build = "0.14"

[dev-dependencies]
crossbeam-channel = "0.5"
anyhow = "1"
test-log = { version = "0.2", default-features = false, features = ["trace"] }

[[bin]]
name="server"
path="./src/bin/server.rs"
